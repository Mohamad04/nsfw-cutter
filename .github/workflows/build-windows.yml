name: Build Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      max_installed_mib:
        description: Installed size budget in MiB (measure with a large value, then set the real budget)
        default: "1150"
      max_archive_mib:
        description: ZIP size budget in MiB
        default: "450"

permissions:
  contents: read

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ai-production.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-ai-production.txt

      - name: Cache pinned FFmpeg and cuBLAS
        uses: actions/cache@v4
        with:
          path: |
            vendor/ffmpeg
            vendor/cuda12-cublas
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/ffmpeg-pin.json', 'scripts/cuda12-cublas-pin.json') }}

      - name: Build Windows app
        shell: pwsh
        run: ./scripts/build_windows.ps1 -AllowDownload -MaxInstalledSizeMiB ${{ inputs.max_installed_mib || 1150 }} -MaxArchiveSizeMiB ${{ inputs.max_archive_mib || 450 }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: NSFW-Cutter-windows
          path: dist/NSFW-Cutter-windows.zip
          if-no-files-found: error
          retention-days: 14
