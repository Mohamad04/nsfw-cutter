name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if (Test-Path requirements-dev.txt) {
            python -m pip install -r requirements-dev.txt
          } else {
            python -m pip install pytest ruff
          }

      - name: Prepare FFmpeg
        shell: pwsh
        run: ./scripts/prepare_ffmpeg.ps1

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $scripts = @(
            'scripts/build_windows.ps1',
            'scripts/install.ps1',
            'scripts/prepare_ffmpeg.ps1',
            'scripts/test_release_candidate.ps1',
            'scripts/uninstall.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$script has PowerShell syntax errors: $($errors -join '; ')"
            }
          }

      - name: Lint
        run: ruff check --isolated --select E4,E7,E9,F .

      - name: Lint QML
        run: pyside6-qmllint vue/qml/Main.qml

      - name: Unit and integration tests
        run: pytest -q -m "not e2e"

      - name: Real-media end-to-end tests
        run: pytest -q -m e2e
