name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if (Test-Path requirements-dev.txt) {
            python -m pip install -r requirements-dev.txt
          } else {
            python -m pip install pytest ruff
          }
          # Exercise the fixed graph and structured-output adapter without installing
          # Torch, faster-whisper, bitsandbytes, timm, or any model weights.
          python -m pip install langgraph==1.2.10 transformers==5.14.1 qwen-vl-utils==0.0.14 lm-format-enforcer==0.11.3

      - name: Prepare FFmpeg
        shell: pwsh
        run: ./scripts/prepare_ffmpeg.ps1

      - name: Lint
        run: ruff check . --select E4,E7,E9,F

      - name: Test
        run: pytest -q
