name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and release Windows
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MAX_ARCHIVE_SIZE_MIB: "450"
      MAX_INSTALLED_SIZE_MIB: "1150"

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Validate tag and stamp application version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG_NAME
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH; received $tag"
          }
          $version = $tag.Substring(1)
          Set-Content -Path version.py -Encoding UTF8 -Value @(
            '# This file is the single source of truth for the application version.',
            '# Patched by the release CI pipeline from the git tag.',
            "__version__ = `"$version`""
          )
          python -c "from version import __version__; assert __version__ == '$version'"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Prepare FFmpeg
        shell: pwsh
        run: ./scripts/prepare_ffmpeg.ps1

      - name: Lint Python
        run: ruff check --isolated --select E4,E7,E9,F .

      - name: Unit and integration tests
        run: pytest -q -m "not e2e"

      - name: Real-media end-to-end tests
        run: pytest -q -m e2e

      - name: Lint QML
        run: pyside6-qmllint vue/qml/Main.qml

      - name: Validate PowerShell scripts
        shell: powershell
        run: |
          $scripts = @(
            'scripts/build_windows.ps1',
            'scripts/install.ps1',
            'scripts/prepare_ffmpeg.ps1',
            'scripts/test_release_candidate.ps1',
            'scripts/uninstall.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$script has PowerShell syntax errors: $($errors -join '; ')"
            }
          }

      - name: Build tagged Windows package
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ./scripts/build_windows.ps1 `
            -ReleaseTag $env:TAG_NAME `
            -MaxInstalledSizeMiB ([int]$env:MAX_INSTALLED_SIZE_MIB) `
            -MaxArchiveSizeMiB ([int]$env:MAX_ARCHIVE_SIZE_MIB)

      - name: Verify runtime files, paths, and size budget
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $zipPath = "dist/NSFW-Cutter-$env:TAG_NAME-windows.zip"
          $verifiedRoot = Join-Path $env:RUNNER_TEMP 'verified-release'
          if (Test-Path -LiteralPath $verifiedRoot) {
            Remove-Item -LiteralPath $verifiedRoot -Recurse -Force
          }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifiedRoot
          $verifiedAppDir = Join-Path $verifiedRoot 'VideoCutter'
          python scripts/verify_windows_artifact.py `
            --project-root $env:GITHUB_WORKSPACE `
            --app-dir $verifiedAppDir `
            --zip-path $zipPath `
            --release-tag $env:TAG_NAME `
            --max-installed-mib $env:MAX_INSTALLED_SIZE_MIB `
            --max-archive-mib $env:MAX_ARCHIVE_SIZE_MIB `
            --forbidden-path 'D:\Projet STAGE NSFW\NSFW'

          Add-Content $env:GITHUB_ENV "VERIFIED_APP_DIR=$verifiedAppDir"

          $installedBytes = (Get-ChildItem $verifiedAppDir -Recurse -File | Measure-Object Length -Sum).Sum
          $archiveBytes = (Get-Item $zipPath).Length
          Add-Content $env:GITHUB_STEP_SUMMARY "## Windows artifact size"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Installed: $([Math]::Round($installedBytes / 1MB, 2)) MiB / $env:MAX_INSTALLED_SIZE_MIB MiB"
          Add-Content $env:GITHUB_STEP_SUMMARY "- ZIP: $([Math]::Round($archiveBytes / 1MB, 2)) MiB / $env:MAX_ARCHIVE_SIZE_MIB MiB"

      - name: Smoke-launch packaged application
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'nsfw-cutter-smoke'
          $env:LOCALAPPDATA = Join-Path $smokeRoot 'LocalAppData'
          $env:APPDATA = Join-Path $smokeRoot 'RoamingAppData'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:NSFW_CUTTER_USER_DATA_ROOT = Join-Path $smokeRoot 'UserData'
          New-Item -Path $env:LOCALAPPDATA, $env:APPDATA -ItemType Directory -Force | Out-Null

          $applicationPath = Join-Path $env:VERIFIED_APP_DIR 'VideoCutter.exe'
          $process = Start-Process `
            -FilePath $applicationPath `
            -ArgumentList '--smoke-test' `
            -WorkingDirectory $env:VERIFIED_APP_DIR `
            -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              throw 'Packaged application smoke test timed out.'
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Generate and verify SHA-256 file
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $zipName = "NSFW-Cutter-$env:TAG_NAME-windows.zip"
          $zipPath = Join-Path 'dist' $zipName
          $checksumPath = "$zipPath.sha256"
          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath $checksumPath -Value "$hash  $zipName" -Encoding ASCII

          $checksumText = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          if ($checksumText -notmatch '^(?<hash>[a-f0-9]{64})  .+$') {
            throw 'Generated checksum file has an invalid format.'
          }
          if ($Matches.hash -ine (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash) {
            throw 'Generated checksum does not match the release ZIP.'
          }

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $zipPath = "dist/NSFW-Cutter-$env:TAG_NAME-windows.zip"
          gh release create $env:TAG_NAME `
            $zipPath `
            "$zipPath.sha256" `
            --verify-tag `
            --title "NSFW Cutter $env:TAG_NAME" `
            --generate-notes
